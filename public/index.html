<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бурмалдамес</title>
  <style>
    :root {
      --bg: #0b1320;
      --panel: rgba(23, 33, 43, 0.92);
      --panel-solid: #17212b;
      --border: rgba(255, 255, 255, 0.06);
      --input: #22303f;
      --accent: #3b8ee6;
      --accent-2: #7c5cff;
      --own-1: #3b8ee6;
      --own-2: #2d6fc4;
      --other: #1c2a39;
      --text: #f1f5f9;
      --muted: #8493a6;
      --online: #5fd37a;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button, input { font: inherit; }

    /* ---------- Экран входа ---------- */
    #login {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 92, 255, 0.35), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(59, 142, 230, 0.35), transparent 40%),
        var(--bg);
      z-index: 10;
    }
    #login.hidden { display: none; }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      animation: pop 0.35s ease-out;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 10px 30px rgba(59, 142, 230, 0.4);
    }

    .card h2 { text-align: center; font-size: 22px; margin-bottom: 4px; }
    .card .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 14px 0 6px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field {
      display: flex;
      align-items: center;
      background: var(--input);
      border-radius: 14px;
      border: 1px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(59, 142, 230, 0.2);
    }
    .field span { padding-left: 14px; color: var(--muted); }
    .field input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      padding: 13px 14px;
      font-size: 15px;
    }

    .avatars {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .avatars button {
      aspect-ratio: 1;
      border: none;
      border-radius: 14px;
      background: var(--input);
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    }
    .avatars button:hover { transform: scale(1.08); }
    .avatars button.selected {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 142, 230, 0.35);
    }

    .error {
      color: var(--danger);
      font-size: 13px;
      min-height: 18px;
      margin-top: 12px;
      text-align: center;
    }

    .primary {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
    }
    .primary:hover { filter: brightness(1.08); }
    .primary:active { transform: scale(0.98); }

    /* ---------- Приложение ---------- */
    #app { height: 100%; display: flex; }
    #app.hidden { display: none; }

    /* Аватар (общий класс) */
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      position: relative;
      box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.2);
    }
    .avatar.sm { width: 32px; height: 32px; font-size: 16px; }

    .avatar .dot {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--online);
      border: 2px solid var(--panel-solid);
    }

    /* Левая панель */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--panel-solid);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .me {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .me .info { flex: 1; min-width: 0; }
    .me .nick {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .me .user { font-size: 13px; color: var(--muted); }

    .logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .logout:hover { color: var(--text); border-color: var(--muted); }

    .section-title {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 16px 16px 8px;
    }

    #users {
      list-style: none;
      overflow-y: auto;
      padding: 0 8px 12px;
    }
    #users li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 12px;
      transition: background 0.15s;
    }
    #users li:hover { background: rgba(255, 255, 255, 0.04); }
    #users .info { min-width: 0; flex: 1; }
    #users .name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #users .handle { font-size: 12px; color: var(--muted); }

    /* Чат */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(124, 92, 255, 0.08), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(59, 142, 230, 0.08), transparent 35%),
        var(--bg);
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .top .title { font-weight: 600; font-size: 16px; }
    .top .status { font-size: 13px; color: var(--muted); }
    .top .status.online { color: var(--online); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }
    .empty .big { font-size: 48px; margin-bottom: 8px; }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: pop 0.25s ease-out;
    }
    .row.own { justify-content: flex-end; }
    .row.group { margin-top: 10px; }
    .row .spacer { width: 32px; flex-shrink: 0; }

    .bubble {
      max-width: min(70%, 520px);
      padding: 8px 12px 6px;
      border-radius: 18px;
      background: var(--other);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    .row:not(.own) .bubble { border-bottom-left-radius: 6px; }
    .row.own .bubble {
      background: linear-gradient(135deg, var(--own-1), var(--own-2));
      border-bottom-right-radius: 6px;
    }

    .bubble .name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .bubble .text {
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .bubble .time {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      margin-top: 2px;
    }
    .row.own .time { color: rgba(255, 255, 255, 0.7); }

    /* Поле ввода */
    .composer {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }

    #text {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: var(--input);
      color: var(--text);
      padding: 13px 18px;
      border-radius: 24px;
      font-size: 15px;
      transition: box-shadow 0.2s;
    }
    #text:focus { box-shadow: 0 0 0 3px rgba(59, 142, 230, 0.35); }
    #text::placeholder { color: var(--muted); }

    #send {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s, filter 0.2s;
    }
    #send:hover { filter: brightness(1.1); }
    #send:active { transform: scale(0.9); }
    #send svg { width: 20px; height: 20px; margin-left: 2px; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }

    /* Телефон: список людей скрываем, их количество видно в шапке */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .bubble { max-width: 82%; }
    }
  </style>
</head>
<body>

  <!-- Экран входа -->
  <div id="login">
    <div class="card">
      <div class="logo">💬</div>
      <h2>Добро пожаловать в Бурмалдамес</h2>
      <p class="sub">Придумайте юзернейм, ник и аватар</p>

      <label for="username">Юзернейм</label>
      <div class="field">
        <span>@</span>
        <input id="username" placeholder="ivan_petrov" maxlength="32" autocomplete="off">
      </div>

      <label for="nickname">Ник</label>
      <div class="field">
        <input id="nickname" placeholder="Иван" maxlength="32" autocomplete="off">
      </div>

      <label>Аватар</label>
      <div class="avatars" id="avatars"></div>

      <div class="error" id="error"></div>
      <button class="primary" id="enter">Войти в чат</button>
    </div>
  </div>

  <!-- Приложение -->
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="me">
        <div class="avatar" id="meAvatar"></div>
        <div class="info">
          <div class="nick" id="meNick"></div>
          <div class="user" id="meUser"></div>
        </div>
        <button class="logout" id="logout">Выйти</button>
      </div>
      <div class="section-title">В сети: <span id="count">0</span></div>
      <ul id="users"></ul>
    </aside>

    <main class="chat">
      <header class="top">
        <div class="avatar" style="background: linear-gradient(135deg, #6ab3f3, #7c5cff)">🌐</div>
        <div>
          <div class="title">Бурмалдамес</div>
          <div class="status" id="status">подключение...</div>
        </div>
      </header>

      <div id="messages"></div>

      <form class="composer" id="form">
        <input id="text" placeholder="Написать сообщение" autocomplete="off" maxlength="2000">
        <button id="send" type="submit" title="Отправить">
          <svg viewBox="0 0 24 24">
            <path d="M3 11l18-8-8 18-2-8-8-2z" fill="currentColor"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const EMOJIS = ['🦊', '🐼', '🐯', '🦄', '🐸', '🐙', '🦉', '🐨', '🚀', '⚡', '🌟', '🔥'];
    const socket = io();

    const $ = (id) => document.getElementById(id);
    const loginEl = $('login');
    const appEl = $('app');
    const usernameIn = $('username');
    const nicknameIn = $('nickname');
    const errorEl = $('error');
    const avatarsEl = $('avatars');
    const messagesEl = $('messages');
    const usersEl = $('users');
    const statusEl = $('status');
    const form = $('form');
    const textIn = $('text');

    let me = null;                       // данные о себе, пришедшие с сервера
    let selectedAvatar = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    let lastUser = null;                 // для группировки сообщений одного автора

    // ---------- Помощники ----------

    function getSaved() {
      try { return JSON.parse(localStorage.getItem('profile')); }
      catch { return null; }
    }

    function avatarStyle(hue) {
      return `background: linear-gradient(135deg, hsl(${hue} 70% 55%), hsl(${(hue + 40) % 360} 70% 42%))`;
    }

    function makeAvatar(user, size = '') {
      const el = document.createElement('div');
      el.className = 'avatar ' + size;
      el.style.cssText = avatarStyle(user.hue);
      el.textContent = user.avatar;
      return el;
    }

    function timeOf(iso) {
      return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function showLogin(msg = '') {
      loginEl.classList.remove('hidden');
      appEl.classList.add('hidden');
      errorEl.textContent = msg;
    }

    function showApp() {
      loginEl.classList.add('hidden');
      appEl.classList.remove('hidden');
      errorEl.textContent = '';
    }

    // ---------- Выбор аватара ----------

    function renderAvatarPicker() {
      avatarsEl.innerHTML = '';
      EMOJIS.forEach((emoji) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = emoji;
        b.classList.toggle('selected', emoji === selectedAvatar);
        b.onclick = () => {
          selectedAvatar = emoji;
          renderAvatarPicker();
        };
        avatarsEl.appendChild(b);
      });
    }
    renderAvatarPicker();

    // Юзернейм: только латиница, цифры и _
    usernameIn.addEventListener('input', () => {
      usernameIn.value = usernameIn.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
    });

    // ---------- Вход ----------

    function join(profile) {
      socket.emit('join', profile, (res) => {
        if (!res.ok) {
          // Профиль не удаляем: заполним форму, чтобы человек мог поправить
          usernameIn.value = profile.username;
          nicknameIn.value = profile.nickname;
          selectedAvatar = profile.avatar;
          renderAvatarPicker();
          showLogin(res.error);
          return;
        }

        me = res.user;
        localStorage.setItem('profile', JSON.stringify(profile));

        const av = $('meAvatar');
        av.style.cssText = avatarStyle(me.hue);
        av.textContent = me.avatar;
        $('meNick').textContent = me.nickname;
        $('meUser').textContent = '@' + me.username;

        showApp();
        renderHistory(res.history);
      });
    }

    $('enter').onclick = () => {
      if (!socket.connected) {
        errorEl.textContent = 'Нет соединения с сервером';
        return;
      }
      join({
        username: usernameIn.value.trim(),
        nickname: nicknameIn.value.trim(),
        avatar: selectedAvatar,
      });
    };

    [usernameIn, nicknameIn].forEach((el) => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('enter').click();
      });
    });

    $('logout').onclick = () => {
      localStorage.removeItem('profile');
      location.reload();
    };

    // Если профиль сохранён, не мелькаем экраном входа
    if (getSaved()) loginEl.classList.add('hidden');

    // ---------- Соединение ----------

    socket.on('connect', () => {
      statusEl.textContent = 'подключение...';
      const saved = getSaved();
      if (saved) join(saved); // после переподключения входим снова
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'нет соединения, переподключение...';
      statusEl.classList.remove('online');
    });

    socket.on('users', (list) => {
      $('count').textContent = list.length;
      statusEl.textContent = `${list.length} в сети`;
      statusEl.classList.add('online');

      usersEl.innerHTML = '';
      list.forEach((u) => {
        const li = document.createElement('li');

        const av = makeAvatar(u);
        const dot = document.createElement('span');
        dot.className = 'dot';
        av.appendChild(dot);

        const info = document.createElement('div');
        info.className = 'info';

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = u.nickname + (me && u.username === me.username ? ' (вы)' : '');

        const handle = document.createElement('div');
        handle.className = 'handle';
        handle.textContent = '@' + u.username;

        info.append(name, handle);
        li.append(av, info);
        usersEl.appendChild(li);
      });
    });

    // ---------- Сообщения ----------

    function showEmpty() {
      const d = document.createElement('div');
      d.className = 'empty';
      d.id = 'empty';
      d.innerHTML = '<div class="big">👋</div>Пока тихо. Напишите первым!';
      messagesEl.appendChild(d);
    }

    function renderHistory(list) {
      messagesEl.innerHTML = '';
      lastUser = null;
      if (list.length === 0) showEmpty();
      list.forEach((m) => addMessage(m, false));
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(msg, scroll = true) {
      const empty = $('empty');
      if (empty) empty.remove();

      const own = !!me && msg.user.username === me.username;
      const grouped = lastUser === msg.user.username;
      lastUser = msg.user.username;

      const row = document.createElement('div');
      row.className = 'row' + (own ? ' own' : '') + (grouped ? '' : ' group');

      if (!own) {
        if (grouped) {
          const sp = document.createElement('div');
          sp.className = 'spacer';
          row.appendChild(sp);
        } else {
          row.appendChild(makeAvatar(msg.user, 'sm'));
        }
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (!own && !grouped) {
        const name = document.createElement('div');
        name.className = 'name';
        name.style.color = `hsl(${msg.user.hue} 80% 72%)`;
        name.textContent = msg.user.nickname;
        bubble.appendChild(name);
      }

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = msg.text; // textContent защищает от HTML-инъекций

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = timeOf(msg.time);

      bubble.append(text, time);
      row.appendChild(bubble);
      messagesEl.appendChild(row);

      if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    socket.on('message', (msg) => {
      if (me) addMessage(msg); // на экране входа сообщения не показываем
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = textIn.value.trim();
      if (!text || !me) return;
      socket.emit('message', text);
      textIn.value = '';
      textIn.focus();
    });
  </script>
</body>
</html>
